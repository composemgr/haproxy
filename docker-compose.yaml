# nginx proxy address - http://172.17.0.1:8104

name: haproxy
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  app:
    image: haproxy:latest
    pull_policy: always
    container_name: haproxy-app
    restart: always
    logging: *default-logging
    networks:
      - haproxy
    ports:
      - "80:80"
      - "443:443"
      - "172.17.0.1:8104:8404"
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - ./volumes/config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./volumes/data/haproxy:/var/lib/haproxy

networks:
  haproxy:
    name: haproxy
    external: false
