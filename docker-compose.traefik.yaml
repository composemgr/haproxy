name: haproxy
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: haproxy:latest
    container_name: haproxy-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: haproxy-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/8404']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro'
      - './volumes/data/haproxy:/var/lib/haproxy:z'
      - './volumes/config/haproxy/:/usr/local/etc/haproxy/lua:ro'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.haproxy-app.entrypoints=http'
      - 'traefik.http.routers.haproxy-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.middlewares.haproxy-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.haproxy-app.middlewares=haproxy-app-https-redirect'
      - 'traefik.http.routers.haproxy-app-secure.entrypoints=https'
      - 'traefik.http.routers.haproxy-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.haproxy-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.haproxy-app-secure.service=haproxy-app'
      - 'traefik.http.services.haproxy-app.loadbalancer.server.port=8404'
    networks:
      - haproxy
      - traefik

networks:
  haproxy:
    name: haproxy
    external: false
  traefik:
    external: true
